name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-gallery can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore image derivatives
        uses: actions/cache@v4
        with:
          path: ./.cache
          key: eleventy-img-${{ hashFiles('gallery/**') }}
          restore-keys: |
            eleventy-img-

      - run: npm ci

      # Size, dimension and naming warnings for the files this push or PR
      # touched, as ::warning annotations. The full-tree run inside
      # `npm run build` reports the same findings for legacy originals as
      # ::notice, so they cannot crowd out a new upload's warnings (Actions
      # shows at most 10 annotations per level per step). An all-zero
      # `github.event.before` (new branch) or an empty value (manual run)
      # makes the script check every file instead.
      - run: node scripts/check-gallery.mjs --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes on every push to main. Pull requests stop after the build job.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be set to build from this workflow, or the deployment below
      # fails and the repository keeps running Jekyll over the source (which
      # cannot compile the Nunjucks templates). actions/configure-pages does
      # not cover this: its findOrCreatePagesSite() returns early when a Pages
      # site already exists, so it only sets the build type when Pages is off
      # entirely. Set it explicitly. The call is idempotent, needs only the
      # pages: write permission this job already has, and fails the run if it
      # is refused rather than deploying nothing.
      - name: Build Pages from this workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/${{ github.repository }}/pages" \
            -f build_type=workflow \
          || gh api --method POST "repos/${{ github.repository }}/pages" \
            -f build_type=workflow

      - id: deployment
        uses: actions/deploy-pages@v4
