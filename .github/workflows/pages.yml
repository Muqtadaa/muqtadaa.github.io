name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore image derivatives
        uses: actions/cache@v4
        with:
          path: ./.cache
          key: eleventy-img-${{ hashFiles('gallery/**', 'digitalart/art/**', 'graphicdesign/art/**') }}
          restore-keys: |
            eleventy-img-

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Only runs on main once the owner has switched Settings > Pages > Source to
  # "GitHub Actions" and set the repository variable PAGES_DEPLOY=true.
  # Until then, pushes and PRs still prove the build without a failing deploy.
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
