name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages needs these to set the Pages build type to "workflow".
      pages: write
      id-token: write
    steps:
      # Points the repository's Pages site at this workflow (build type
      # "workflow") and enables Pages if it is off, so deploying does not
      # depend on anyone changing Settings > Pages by hand. If the token may
      # not change it, this step fails with a clear message instead of the
      # deploy silently publishing nothing.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/checkout@v4
        with:
          # Full history so check-gallery can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore image derivatives
        uses: actions/cache@v4
        with:
          path: ./.cache
          key: eleventy-img-${{ hashFiles('gallery/**') }}
          restore-keys: |
            eleventy-img-

      - run: npm ci

      # Size, dimension and naming warnings for the files this push or PR
      # touched, as ::warning annotations. The full-tree run inside
      # `npm run build` reports the same findings for legacy originals as
      # ::notice, so they cannot crowd out a new upload's warnings (Actions
      # shows at most 10 annotations per level per step). An all-zero
      # `github.event.before` (new branch) or an empty value (manual run)
      # makes the script check every file instead.
      - run: node scripts/check-gallery.mjs --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes on every push to main. Pull requests stop after the build job.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
