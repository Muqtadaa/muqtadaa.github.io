name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-gallery can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Restore image derivatives
        uses: actions/cache@v4
        with:
          path: ./.cache
          key: eleventy-img-${{ hashFiles('gallery/**') }}
          restore-keys: |
            eleventy-img-

      - run: npm ci

      # Size, dimension and naming warnings for the files this push or PR
      # touched, as ::warning annotations. The full-tree run inside
      # `npm run build` reports the same findings for legacy originals as
      # ::notice, so they cannot crowd out a new upload's warnings (Actions
      # shows at most 10 annotations per level per step). An all-zero
      # `github.event.before` (new branch) or an empty value (manual run)
      # makes the script check every file instead.
      - run: node scripts/check-gallery.mjs --changed-since "${{ github.event.pull_request.base.sha || github.event.before }}"

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publishes on every push to main. Pull requests stop after the build job.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Publishing only works when Settings > Pages > Build and deployment >
      # Source is "GitHub Actions" (build type "workflow"). The workflow cannot
      # set that itself: GITHUB_TOKEN's pages: write covers Pages *deployments*,
      # not the site's configuration, so PUT and POST /repos/{owner}/{repo}/pages
      # both answer 403 "Resource not accessible by integration". Read the
      # setting instead and say exactly what to change, because deploy-pages'
      # own error for this is not obvious. A read that fails is not treated as a
      # problem, so this can never block a deployment that would have worked.
      - name: Check the Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type || true)"
          case "$build_type" in
            workflow)
              echo "Pages build type is \"workflow\"; deploying."
              ;;
            "")
              echo "::warning::Could not read the Pages configuration; letting the deployment proceed."
              ;;
            *)
              echo "::error::Pages build type is \"$build_type\", not \"workflow\", so this deployment cannot publish. Set Settings > Pages > Build and deployment > Source to \"GitHub Actions\", then re-run this workflow. The default GITHUB_TOKEN is not permitted to change that setting."
              exit 1
              ;;
          esac

      - id: deployment
        uses: actions/deploy-pages@v4
